name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install development checks
        run: |
          python -m pip install -r tests/requirements.txt
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check secrets and publication paths
        run: |
          python -m unittest discover -s tests/security
          python scripts/check_secrets.py
      - name: Check Go vulnerabilities
        run: |
          govulncheck ./...
      - name: Check backend and lifecycle
        run: |
          python tests/desktop/check.py
      - name: Check native firmware and display
        run: |
          python tests/firmware/check.py
          python tests/display/check.py

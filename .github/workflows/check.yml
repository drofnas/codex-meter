name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install development checks
        run: |
          python -m pip install -r tests/requirements.txt
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check secrets and publication paths
        run: |
          python -m unittest discover -s tests/security
          python scripts/check_secrets.py
      - name: Check Go vulnerabilities
        run: |
          govulncheck ./...
      - name: Check backend and lifecycle
        run: |
          python tests/desktop/check.py
      - name: Check native firmware and display
        run: |
          python tests/firmware/check.py
          python tests/display/check.py

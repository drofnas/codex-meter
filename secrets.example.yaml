# Copy to ignored secrets.yaml. Used by the networked CYD firmware.
# Use the Mac's literal LAN IPv4 address and a dedicated API token.
wifi_ssid: "YOUR_WIFI_NAME"
wifi_password: "YOUR_WIFI_PASSWORD"
meter_api_url: "http://192.0.2.1:8080/v2/usage"
meter_api_token: "REPLACE_WITH_THE_SAME_64_HEX_TOKEN_FROM_ENV"
meter_poll_interval: "60s"
meter_http_timeout: "10s"
